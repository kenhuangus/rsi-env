<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
  </defs>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Sustained recursive improvement: Knowledge × Self (offline toy run)</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#475569">Same shape as the paper's case study (H0/M0 → H1/M0 → H1/M1); numbers are from this repository's toy backend</text>

  <!-- axes -->
  <g font-size="11" fill="#64748b" text-anchor="end">
    <text x="80" y="334">0</text><text x="80" y="274">25</text><text x="80" y="214">50</text><text x="80" y="154">75</text><text x="80" y="94">100</text>
  </g>
  <g stroke="#e2e8f0">
    <line x1="88" y1="90" x2="600" y2="90"/><line x1="88" y1="150" x2="600" y2="150"/>
    <line x1="88" y1="210" x2="600" y2="210"/><line x1="88" y1="270" x2="600" y2="270"/>
  </g>
  <line x1="88" y1="330" x2="600" y2="330" stroke="#334155"/>
  <text x="30" y="210" font-size="12" fill="#334155" transform="rotate(-90 30 210)" text-anchor="middle">score (avg@3, %)</text>

  <!-- bars: SimpleQA (blue, target) and GPQA (gray) -->
  <g>
    <rect x="120" y="199.4" width="56" height="130.6" fill="#2563eb" rx="3"/>
    <rect x="182" y="181.9" width="56" height="148.1" fill="#94a3b8" rx="3"/>
    <rect x="290" y="193.9" width="56" height="136.1" fill="#2563eb" rx="3"/>
    <rect x="352" y="139.9" width="56" height="190.1" fill="#94a3b8" rx="3"/>
    <rect x="460" y="150" width="56" height="180" fill="#2563eb" rx="3"/>
    <rect x="522" y="156" width="56" height="174" fill="#94a3b8" rx="3"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="148" y="193">54.4</text><text x="210" y="176">61.7</text>
    <text x="318" y="188">56.7</text><text x="380" y="134">79.2</text>
    <text x="488" y="144">75.0</text><text x="550" y="150">72.5</text>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="179" y="352">H0/M0</text><text x="349" y="352">H1/M0</text><text x="519" y="352">H1/M1</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#475569">
    <text x="179" y="368">seed</text><text x="349" y="368">round 1 · harness</text><text x="519" y="368">round 2 · SFT</text>
  </g>
  <rect x="150" y="390" width="12" height="12" fill="#2563eb"/><text x="168" y="401" font-size="12" fill="#334155">mini-SimpleQA (target)</text>
  <rect x="330" y="390" width="12" height="12" fill="#94a3b8"/><text x="348" y="401" font-size="12" fill="#334155">mini-GPQA (off-target: gain then partial regression)</text>

  <!-- right panel -->
  <rect x="640" y="80" width="340" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="660" y="106" font-size="14" font-weight="700" fill="#0f172a">What each system did</text>
  <g font-size="12" fill="#334155">
    <text x="660" y="132" font-weight="700" fill="#1e40af">Round 1 — Improver = H0/M0</text>
    <text x="660" y="150">built 60-item local validation set</text>
    <text x="660" y="167">wrote candidate/harness/self_consistency.py</text>
    <text x="660" y="184">local 51.7 → 62.5 · submitted → H1/M0</text>
    <text x="660" y="212" font-weight="700" fill="#1e40af">Round 2 — Improver = H1/M0</text>
    <text x="660" y="230">probed 200 public facts ×2, 109 missed</text>
    <text x="660" y="247">48 prompt–completion pairs → train-sft</text>
    <text x="660" y="264">2 epochs, loss 6.00 → 5.16 → 4.44</text>
    <text x="660" y="281">local 62.5 → 75.0 · submitted → H1/M1</text>
    <text x="660" y="309" font-weight="700" fill="#1e40af">Round 3 — Improver = H1/M1</text>
    <text x="660" y="327">no untried justified change</text>
    <text x="660" y="344">journal conclusion → TASK_COMPLETE</text>
  </g>
  <text x="660" y="378" font-size="11" fill="#64748b">Simulated SFT interference lowers MC accuracy,</text>
  <text x="660" y="393" font-size="11" fill="#64748b">echoing "gains coexist with regressions".</text>
</svg>
