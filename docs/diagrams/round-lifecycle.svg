<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <filter id="s" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">One improvement round: 𝒮ₜ₊₁ ∼ 𝒯(· | 𝒮ₜ, uₜ),  uₜ = (Eₜ, Δₜ),  Eₜ ⊆ {θₜ, Hₜ}</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#475569">Acceptance means "valid and executable", never "better on the benchmark"</text>

  <!-- lanes -->
  <rect x="20" y="74" width="960" height="190" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="34" y="96" font-size="13" font-weight="700" fill="#1e40af">RSI Environment · Improver</text>
  <rect x="20" y="276" width="960" height="226" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="34" y="298" font-size="13" font-weight="700" fill="#115e59">Host Controller</text>

  <g font-size="12" fill="#0f172a" filter="url(#s)">
    <rect x="36" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <rect x="196" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <rect x="356" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <rect x="516" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <rect x="676" y="110" width="140" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
    <rect x="836" y="110" width="132" height="70" rx="10" fill="#ffffff" stroke="#2563eb"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <text x="106" y="136" font-weight="700">1 · Inspect</text><text x="106" y="154">status, lineage,</text><text x="106" y="170">journal, records</text>
    <text x="266" y="136" font-weight="700">2 · Choose Eₜ</text><text x="266" y="154">harness, model,</text><text x="266" y="170">or both</text>
    <text x="426" y="136" font-weight="700">3 · Local evidence</text><text x="426" y="154">own tests / data</text><text x="426" y="170">(or feedback*)</text>
    <text x="586" y="136" font-weight="700">4 · Build Δₜ</text><text x="586" y="154">edit candidate/ or</text><text x="586" y="170">train-sft → cand-id</text>
    <text x="746" y="136" font-weight="700">5 · Compare</text><text x="746" y="154">candidate vs active</text><text x="746" y="170">record in journal</text>
    <text x="902" y="136" font-weight="700">6 · Decide</text><text x="902" y="154">rsi submit or</text><text x="902" y="170">TASK_COMPLETE</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M176,145 L194,145" marker-end="url(#a)"/><path d="M336,145 L354,145" marker-end="url(#a)"/>
    <path d="M496,145 L514,145" marker-end="url(#a)"/><path d="M656,145 L674,145" marker-end="url(#a)"/>
    <path d="M816,145 L834,145" marker-end="url(#a)"/>
  </g>
  <text x="500" y="214" text-anchor="middle" font-size="12" fill="#1e3a8a">uses controller services along the way: infer · local-eval · train-sft · feedback* (Benchmark-Guided only)</text>
  <text x="500" y="246" text-anchor="middle" font-size="11" fill="#64748b">no capability score is required to submit; the Improver must justify the update with its own evidence</text>

  <!-- controller side -->
  <path d="M902,182 L902,318" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <g filter="url(#s)">
    <rect x="780" y="320" width="188" height="78" rx="10" fill="#ffffff" stroke="#0d9488"/>
    <rect x="556" y="320" width="196" height="78" rx="10" fill="#ffffff" stroke="#0d9488"/>
    <rect x="300" y="320" width="228" height="78" rx="10" fill="#ffffff" stroke="#0d9488"/>
    <rect x="36" y="320" width="236" height="78" rx="10" fill="#ffffff" stroke="#dc2626"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
    <text x="874" y="344" font-weight="700">Validity check</text><text x="874" y="362">interface + load-and-sample</text><text x="874" y="378">no benchmark contamination</text>
    <text x="654" y="344" font-weight="700">Register successor</text><text x="654" y="362">H/M ids · parent link</text><text x="654" y="378">refresh active/ snapshot</text>
    <text x="414" y="344" font-weight="700">Generation ends</text><text x="414" y="362">Self: 𝒮ₜ₊₁ becomes the Improver</text><text x="414" y="378">Teacher: fixed Improver continues</text>
    <text x="154" y="344" font-weight="700" fill="#b91c1c">Rejected</text><text x="154" y="362">diagnostics appended to</text><text x="154" y="378">experiments/submissions.jsonl</text>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M780,359 L754,359" marker-end="url(#a)"/><path d="M556,359 L530,359" marker-end="url(#a)"/>
  </g>
  <path d="M874,398 C874,470 154,470 154,400" stroke="#dc2626" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="514" y="462" text-anchor="middle" font-size="12" fill="#b91c1c">invalid → failed attempt retained in 𝒫ₜ₊₁ (evidence reused next round)</text>
  <text x="500" y="492" text-anchor="middle" font-size="12" fill="#115e59">Budget: 10 rounds × 3 h (early finish allowed). Capability is evaluated independently after the run.</text>
</svg>
