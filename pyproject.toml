[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-env"
version = "0.1.0"
description = "RSI-Env: an open-ended environment for recursive self-improvement of agents (implementation of arXiv:2611.01736)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kenhuangus" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.60"]
tinker = ["tinker"]
dev = ["pytest>=8"]

[project.scripts]
rsi-env = "rsi_env.cli:main"
rsi = "rsi_env.envcli:main"

[tool.setuptools.packages.find]
include = ["rsi_env*"]

[tool.setuptools.package-data]
rsi_env = ["harness_template/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
